apply plugin: "war"

bootWar {
    mainClass = "com.heavenscode.rac.RacApp"
    includes = ["WEB-INF/**", "META-INF/**"]
    webXml = file("${project.rootDir}/src/main/webapp/WEB-INF/web.xml")
}

war {
    webAppDirName = "build/resources/main/static/"
    webXml = file("${project.rootDir}/src/main/webapp/WEB-INF/web.xml")
    enabled = true
}

configurations {
  all {
    resolutionStrategy {
    }
  }
}

dependencies {
    implementation "com.microsoft.sqlserver:mssql-jdbc"
    testImplementation "org.testcontainers:mssqlserver"
}



if (!project.tasks.findByName('bootBuildInfo')) {
    springBoot {
        buildInfo()
    }
}

bootRun {
    args = ["--spring.profiles.active=${springProfiles}"]
}

if (!project.tasks.findByName('webapp')) {
    task webapp(type: NpmTask) {
        dependsOn npmInstall
        args = ["run", "webapp:prod"]
        environment = [APP_VERSION: project.version]
        outputs.upToDateWhen { false }
    }
}

processResources {
    inputs.property('version', version)
    inputs.property('springProfiles', springProfiles)
    filesMatching("**/application.yml") {
        filter {
            it.replace("#project.version#", version)
        }
        filter {
            it.replace("@spring.profiles.active@", springProfiles)
        }
    }
}

if (!project.tasks.findByName('integrationTest')) {
    task integrationTest(type: Test) {
        maxHeapSize = "1G"
        useJUnitPlatform()
        description = "Execute integration tests."
        group = "verification"
        include "**/*IT*", "**/*IntTest*"
        testLogging {
            events 'FAILED', 'SKIPPED'
        }
        systemProperty('spring.profiles.active', 'testprod')
        systemProperty('java.security.egd', 'file:/dev/./urandom')
        // uncomment if the tests reports are not generated
        // see https://github.com/jhipster/generator-jhipster/pull/2771 and https://github.com/jhipster/generator-jhipster/pull/4484
        // ignoreFailures true
        reports.html.required = false
    }
    integrationTest.dependsOn test
}


processResources.dependsOn webapp
bootWar.dependsOn processResources
