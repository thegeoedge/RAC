<div class="d-flex justify-content">
  <div class="col-12">
    <form name="editForm" novalidate [formGroup]="editForm">
      <h2
        id="jhi-sales-invoice-service-charge-line-dummy-heading"
        data-cy="SalesInvoiceServiceChargeLineDummyCreateUpdateHeading"
        *ngIf="showCodeField"
      ></h2>

      <div>
        <jhi-alert-error></jhi-alert-error>
        <div *ngIf="!readonly">
          <div class="row mb-3 mt-3 align-items-center">
            <div class="col-md-6">
              <label class="form-label fw-bold">Select Vehicle Type</label>
              <select class="form-select shadow-sm border-0 bg-light" (change)="onDropdownChange($event)">
                <option value="" disabled selected>Choose Vehicle Type...</option>
                <option *ngFor="let vehicletype of vehicletypes" [value]="vehicletype.id">
                  {{ vehicletype.vehicletype }}
                </option>
              </select>
            </div>
            <div class="col-md-6" *ngIf="flattenedBillingOptions.length > 0">
              <label class="form-label fw-bold">Search Services</label>
              <div class="input-group shadow-sm">
                <span class="input-group-text bg-white border-end-0"><fa-icon icon="search"></fa-icon></span>
                <input
                  type="text"
                  class="form-control border-start-0"
                  placeholder="Filter services..."
                  [(ngModel)]="searchTerm"
                  [ngModelOptions]="{ standalone: true }"
                />
              </div>
            </div>
          </div>

          <style>
            .service-card {
              cursor: pointer;
              transition: all 0.2s ease-in-out;
              border: 1px solid #e9ecef !important;
            }
            .service-card:hover {
              transform: translateY(-2px);
              box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1) !important;
              border-color: #0d6efd !important;
            }
            .service-card.selected {
              background-color: #0d6efd !important;
              color: white !important;
              border-color: #0d6efd !important;
            }
            .cursor-pointer {
              cursor: pointer;
            }
          </style>

          <div class="services-container p-3 rounded-3 bg-light mb-3" *ngIf="flattenedBillingOptions.length > 0">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="mb-0 text-primary fw-bold">Available Services</h5>
              <span class="badge bg-primary rounded-pill">{{ selectedServices.length }} selected</span>
            </div>

            <div class="row g-2 overflow-auto" style="max-height: 350px; scrollbar-width: thin">
              <div class="col-md-4 col-sm-6" *ngFor="let option of filteredBillingOptions">
                <div
                  class="card h-100 service-card border-0 shadow-sm transition-all"
                  [class.selected]="isSelected(option.id)"
                  (click)="toggleService(option)"
                >
                  <div class="card-body p-2 d-flex align-items-center">
                    <div class="form-check mb-0">
                      <input
                        class="form-check-input"
                        type="checkbox"
                        [checked]="isSelected(option.id)"
                        (click)="$event.stopPropagation(); toggleService(option)"
                      />
                    </div>
                    <label class="ms-2 mb-0 small text-truncate cursor-pointer" style="flex: 1">{{ option.servicename }}</label>
                  </div>
                </div>
              </div>
              <div class="col-12 text-center py-4 text-muted" *ngIf="filteredBillingOptions.length === 0">
                <fa-icon icon="info-circle"></fa-icon> No services match your search.
              </div>
            </div>
          </div>
        </div>

        <div class="table-responsive rounded-3 shadow-sm mt-4 border">
          <table class="table table-hover align-middle mb-0">
            <thead class="bg-light">
              <tr>
                <th *ngIf="false">ID</th>
                <th *ngIf="false">Invoice Id</th>
                <th *ngIf="false">Line Id</th>
                <th *ngIf="false">Option Id</th>
                <th class="ps-3 py-3">Service Name</th>
                <th *ngIf="false">Service Description</th>
                <th class="text-end">Value</th>
                <th class="text-center">Is Customer Service</th>
                <th class="text-center pe-3" *ngIf="!readonly">Actions</th>
              </tr>
            </thead>
            <tbody formArrayName="serviceChargeLines">
              <tr *ngFor="let line of serviceChargeLinesArray.controls; let i = index" [formGroupName]="i" class="transition-all">
                <td *ngIf="false">
                  <input
                    type="number"
                    class="form-control form-control-sm"
                    formControlName="id"
                    [readonly]="true"
                    *ngIf="line.get('id')?.value"
                  />
                </td>
                <td *ngIf="false">
                  <input type="number" class="form-control form-control-sm" formControlName="invoiceId" />
                </td>
                <td *ngIf="false">
                  <input type="number" class="form-control form-control-sm" formControlName="lineId" />
                </td>
                <td *ngIf="false">
                  <input type="number" class="form-control form-control-sm" formControlName="optionId" />
                </td>
                <td class="ps-3">
                  <div class="input-group input-group-sm">
                    <span class="input-group-text bg-white border-end-0"><fa-icon icon="wrench"></fa-icon></span>
                    <input
                      formControlName="serviceName"
                      type="text"
                      class="form-control border-start-0"
                      (input)="onItemCodeInput($event, i)"
                      [attr.list]="'autocomplete_' + i"
                      [readonly]="readonly"
                      placeholder="Enter service name..."
                    />
                  </div>

                  <datalist [id]="'autocomplete_' + i">
                    <option *ngFor="let item of filteredItems[i]" [value]="item.servicename">
                      {{ item.servicename }}
                    </option>
                  </datalist>
                </td>
                <td *ngIf="false">
                  <input type="text" class="form-control form-control-sm" formControlName="serviceDescription" />
                </td>
                <td class="text-end" style="width: 150px">
                  <div class="input-group input-group-sm justify-content-end">
                    <span class="input-group-text bg-white border-end-0 text-muted small">Rs.</span>
                    <input
                      type="number"
                      class="form-control text-end border-start-0 fw-bold"
                      formControlName="value"
                      [readonly]="readonly"
                      style="max-width: 100px"
                    />
                  </div>
                </td>
                <td class="text-center">
                  <div class="form-check form-switch d-inline-block">
                    <input
                      type="checkbox"
                      class="form-check-input cursor-pointer"
                      formControlName="isCustomerService"
                      [disabled]="readonly"
                    />
                  </div>
                </td>
                <td class="text-center pe-3" *ngIf="!readonly">
                  <button type="button" class="btn btn-link text-danger p-0" (click)="removeServiceChargeLine(i)" title="Delete line">
                    <fa-icon icon="trash-alt" size="lg"></fa-icon>
                  </button>
                </td>
              </tr>
              <tr *ngIf="serviceChargeLinesArray.controls.length === 0">
                <td colspan="4" class="text-center py-4 text-muted small">
                  <fa-icon icon="receipt" size="2x" class="d-block mb-2 opacity-50"></fa-icon>
                  No service charges added yet.
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="mt-3" *ngIf="!readonly">
          <button
            type="button"
            class="btn btn-outline-primary btn-sm border-dashed"
            style="border-style: dashed !important"
            (click)="addServiceChargeLine()"
          >
            <fa-icon icon="plus"></fa-icon> Add New Manual Line
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
