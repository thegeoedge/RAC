# This configuration is intended for development purpose, it's **your** responsibility to harden it for production
name: rac
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2019-CU16-GDR1-ubuntu-20.04
    #image: mcr.microsoft.com/mssql/server:2022-latest
    # volumes:
    #   - ./data/mssql/:/var/opt/mssql/data/
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_PID=Express
      #- SA_PASSWORD=YourStrong!Passw0rd
      - SA_PASSWORD=december99
      #- MSSQL_DATABASE=OziErpWebRathnaweeraService
      - MSSQL_DATABASE=RACTestDB
      - MSSQL_SLEEP=25
      - MSSQL_TLS=1.2
    # If you want to expose these ports outside your dev PC,
    # remove the "127.0.0.1:" prefix
    ports:
      #- 1433:1433
      - 1438:1433
      # - 1431:1431
    restart: always

    command: /bin/bash -c '/opt/mssql/bin/sqlservr --force-lower-tls-1.2 & echo "wait $MSSQL_SLEEP sec for DB to start "; sleep $MSSQL_SLEEP; /opt/mssql-tools/bin/sqlcmd -U sa -P $SA_PASSWORD -d tempdb -q "EXIT(CREATE DATABASE $MSSQL_DATABASE)"; wait;'
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$${SA_PASSWORD}" -Q "USE $${MSSQL_DATABASE}" -b -o /dev/null
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
